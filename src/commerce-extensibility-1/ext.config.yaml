# The [pre-app-build] hooks are auto-generated. Do not remove or manually edit.
# Windows fix (same as commerce-backend-ui-2's hooks): cross-env makes the env-var
# assignment work on cmd.exe, which `aio app build` spawns hooks through regardless
# of the calling shell.
hooks:
  pre-app-build: npx cross-env EXTENSION=extensibility/1 npx aio-commerce-lib-app hooks pre-app-build

operations:
  # These worker processes definitions are auto-generated. Do not remove or manually edit.
  workerProcess:
    - type: action
      impl: app-management/app-config
    - type: action
      impl: app-management/association
    - type: action
      impl: app-management/installation

runtimeManifest:
  packages:
    # This package definition is auto-generated. Do not remove or manually edit.
    app-management:
      license: Apache-2.0
      actions:
        app-config:
          function: .generated/actions/app-management/app-config.js
          web: yes
          runtime: nodejs:24
          inputs:
            LOG_LEVEL: $LOG_LEVEL
          annotations:
            final: true
            require-adobe-auth: true
        association:
          function: .generated/actions/app-management/association.js
          web: yes
          runtime: nodejs:24
          inputs:
            LOG_LEVEL: $LOG_LEVEL
          annotations:
            final: true
            require-adobe-auth: true
        installation:
          function: .generated/actions/app-management/installation.js
          web: yes
          runtime: nodejs:24
          inputs:
            LOG_LEVEL: $LOG_LEVEL
            AIO_COMMERCE_AUTH_IMS_CLIENT_ID: $AIO_COMMERCE_AUTH_IMS_CLIENT_ID
            AIO_COMMERCE_AUTH_IMS_CLIENT_SECRETS: $AIO_COMMERCE_AUTH_IMS_CLIENT_SECRETS
            AIO_COMMERCE_AUTH_IMS_TECHNICAL_ACCOUNT_ID: $AIO_COMMERCE_AUTH_IMS_TECHNICAL_ACCOUNT_ID
            AIO_COMMERCE_AUTH_IMS_TECHNICAL_ACCOUNT_EMAIL: $AIO_COMMERCE_AUTH_IMS_TECHNICAL_ACCOUNT_EMAIL
            AIO_COMMERCE_AUTH_IMS_ORG_ID: $AIO_COMMERCE_AUTH_IMS_ORG_ID
            AIO_COMMERCE_AUTH_IMS_SCOPES: $AIO_COMMERCE_AUTH_IMS_SCOPES
          annotations:
            final: true
            require-adobe-auth: true
          limits:
            timeout: 600000
    commerce-checkout-starter-kit:
      license: Apache-2.0
      actions:
        info:
          function: actions/info/index.js
          web: 'yes'
          runtime: nodejs:24
          annotations:
            require-adobe-auth: true
            final: true
    payment-method:
      license: Apache-2.0
      actions:
        # https://developer.adobe.com/commerce/extensibility/starter-kit/checkout/payment-use-cases/
        validate-payment:
          function: actions/validate-payment/index.js
          web: 'yes'
          runtime: nodejs:24
          inputs:
            LOG_LEVEL: $LOG_LEVEL
            ENABLE_TELEMETRY: true
            stateRegion: apac
            CONFIG_ENCRYPTION_KEY: $CONFIG_ENCRYPTION_KEY
          annotations:
            require-adobe-auth: true
            final: true
        filter-payment:
          function: actions/filter-payment/index.js
          web: 'yes'
          runtime: nodejs:24
          inputs:
            LOG_LEVEL: $LOG_LEVEL
            ENABLE_TELEMETRY: true
          annotations:
            require-adobe-auth: true
            final: true
        # Called directly by the storefront (not a Commerce webhook), so require-adobe-auth is
        # false here — this is our own addition, not part of the base starter-kit scaffold.
        create-session:
          function: actions/create-session/index.js
          web: 'yes'
          runtime: nodejs:24
          inputs:
            LOG_LEVEL: $LOG_LEVEL
            stateRegion: apac
            CONFIG_ENCRYPTION_KEY: $CONFIG_ENCRYPTION_KEY
          annotations:
            require-adobe-auth: false
            final: true
        # Called directly by the storefront when it lands back on return_url after JusPay's
        # hosted page — also our own addition, same reasoning as create-session above.
        payment-status:
          function: actions/payment-status/index.js
          web: 'yes'
          runtime: nodejs:24
          inputs:
            LOG_LEVEL: $LOG_LEVEL
            stateRegion: apac
            CONFIG_ENCRYPTION_KEY: $CONFIG_ENCRYPTION_KEY
          annotations:
            require-adobe-auth: false
            final: true
